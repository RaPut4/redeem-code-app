<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaPut4 STORE</title>
    <!-- Memuat Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            min-height: 100vh;
        }
        .container {
            max-width: 90%;
            margin: auto;
            padding-top: 2rem;
            padding-bottom: 2rem;
        }
        @media (min-width: 768px) {
            .container {
                max-width: 768px;
            }
        }
        /* Styling untuk modal/popup pesan */
        .modal {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        .modal-active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .modal-inactive {
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
        }
        .spinner {
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<!-- Kontainer Utama Aplikasi -->
<div class="container flex justify-center items-start">
    
    <!-- Area Autentikasi (Login/Register) -->
    <div id="authView" class="w-full bg-white shadow-2xl rounded-xl p-6 md:p-10 transition-all duration-300">
        <h1 id="authTitle" class="text-3xl font-extrabold text-center text-indigo-600 mb-6">RaPut4 STORE</h1>
        <h2 id="authTitle" class="text-3xl font-extrabold text-center text-indigo-600 mb-7">APP PREMIUM</h2>
        <form id="authForm" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" required placeholder="email@contoh.com"
                       class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 shadow-sm">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Kata Sandi</label>
                <input type="password" id="password" required placeholder="Minimal 6 karakter"
                       class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 shadow-sm">
            </div>

            <!-- Pesan Error -->
            <p id="authError" class="text-red-500 text-sm hidden"></p>

            <button type="submit" id="authButton"
                    class="w-full flex items-center justify-center bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 ease-in-out shadow-md hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-indigo-500 focus:ring-opacity-50 disabled:opacity-50">
                <span id="authButtonText">Masuk</span>
                <div id="authSpinner" class="spinner h-5 w-5 border-2 border-white ml-2 hidden"></div>
            </button>
        </form>

        <div class="mt-6 text-center">
            <button id="switchModeButton" class="text-indigo-600 hover:text-indigo-800 text-sm font-medium transition duration-150">
                Belum punya akun? Daftar sekarang
            </button>
        </div>
    </div>

    <!-- Area Dashboard & Redeem Code -->
    <div id="dashboardView" class="w-full bg-white shadow-2xl rounded-xl p-6 md:p-10 transition-all duration-300 hidden">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h2 class="text-2xl font-bold text-indigo-600">Dasbor Pengguna</h2>
            <button id="logoutButton" class="bg-red-500 hover:bg-red-600 text-white text-sm font-semibold py-2 px-4 rounded-lg transition duration-150 shadow-md">
                Keluar
            </button>
        </div>

        <!-- Info Pengguna -->
        <div class="bg-indigo-50 p-4 rounded-lg mb-6 border border-indigo-200">
            <p class="text-sm font-semibold text-gray-700">ID Pengguna (Untuk Debug/Share): <span id="displayUserId" class="font-mono text-xs bg-gray-200 p-1 rounded-md ml-2 break-all"></span></p>
            <p class="text-lg font-bold text-indigo-700 mt-2">Saldo Koin: <span id="coinBalance" class="text-2xl">0</span> 💰</p>
        </div>

        <!-- Form Redeem Code -->
        <h3 class="text-xl font-bold text-gray-700 mb-3">Tukarkan Kode Hadiah</h3>
        <div class="flex space-x-2 mb-6">
            <input type="text" id="redeemCodeInput" placeholder="Masukkan Kode (e.g., GEMINI-2025)"
                   class="flex-grow p-3 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 text-lg uppercase tracking-wider transition duration-150 ease-in-out shadow-sm"
                   maxlength="20">
            <button id="redeemButton"
                    class="flex-shrink-0 flex items-center justify-center bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg transition duration-300 ease-in-out shadow-md hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-green-500 focus:ring-opacity-50 disabled:opacity-50 disabled:cursor-not-allowed">
                <span id="redeemButtonText">Tukar</span>
                <div id="redeemSpinner" class="spinner h-5 w-5 border-2 border-white ml-2 hidden"></div>
            </button>
        </div>

        <!-- Riwayat Penukaran -->
        <h3 class="text-xl font-bold text-gray-700 mb-3 mt-8 border-t pt-4">Riwayat Penukaran Saya</h3>
        <ul id="redemptionHistory" class="space-y-2">
            <li class="text-gray-500 italic">Memuat riwayat...</li>
        </ul>
    </div>
</div>

<!-- Modal Kustom untuk Notifikasi (Menggantikan alert()) -->
<div id="customModal" class="modal modal-inactive fixed inset-0 z-50 flex items-center justify-center p-4" aria-modal="true" role="dialog">
    <div class="absolute inset-0 bg-black bg-opacity-50 transition-opacity"></div>
    <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm relative z-10 transition-transform">
        <h4 id="modalTitle" class="text-xl font-bold mb-3 text-center text-gray-800"></h4>
        <p id="modalMessage" class="text-gray-600 mb-4 text-center"></p>
        <button id="closeModalButton" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition duration-150">Tutup</button>
    </div>
</div>


<!-- Logika JavaScript dan Firebase -->
<script type="module">
    // --- Impor Firebase Modules (WAJIB) ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
        getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, 
        createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
        getFirestore, doc, setDoc, getDoc, onSnapshot, collection, 
        query, where, updateDoc, runTransaction, getDocs, setLogLevel
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    
    // Aktifkan logging debug untuk Firebase
    setLogLevel('Debug');

    // --- Variabel Global Canvas (WAJIB DIGUNAKAN) ---
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
    const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

    // --- Firebase Initialization ---
    let app, db, auth;
    let currentUserId = null;
    let isAuthReady = false;
    let isRegisterMode = false;
    let redeemableCodes = {}; // Cache untuk kode yang tersedia

    // --- DOM Elements ---
    const authView = document.getElementById('authView');
    const dashboardView = document.getElementById('dashboardView');
    const authTitle = document.getElementById('authTitle');
    const authForm = document.getElementById('authForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const authButton = document.getElementById('authButton');
    const authButtonText = document.getElementById('authButtonText');
    const authSpinner = document.getElementById('authSpinner');
    const authError = document.getElementById('authError');
    const switchModeButton = document.getElementById('switchModeButton');
    const logoutButton = document.getElementById('logoutButton');
    const displayUserId = document.getElementById('displayUserId');
    const coinBalance = document.getElementById('coinBalance');
    const redeemCodeInput = document.getElementById('redeemCodeInput');
    const redeemButton = document.getElementById('redeemButton');
    const redeemButtonText = document.getElementById('redeemButtonText');
    const redeemSpinner = document.getElementById('redeemSpinner');
    const redemptionHistory = document.getElementById('redemptionHistory');
    
    // Modal Elements
    const customModal = document.getElementById('customModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalMessage = document.getElementById('modalMessage');
    const closeModalButton = document.getElementById('closeModalButton');

    // --- UTILITIES ---

    /**
     * Menampilkan modal notifikasi kustom.
     */
    function showModal(title, message, type = 'info') {
        modalTitle.textContent = title;
        modalMessage.textContent = message;

        modalTitle.classList.remove('text-green-600', 'text-red-600', 'text-blue-600');
        
        if (type === 'success') {
            modalTitle.classList.add('text-green-600');
        } else if (type === 'error') {
            modalTitle.classList.add('text-red-600');
        } else {
            modalTitle.classList.add('text-blue-600');
        }

        customModal.classList.remove('modal-inactive');
        customModal.classList.add('modal-active');
    }

    /**
     * Menyembunyikan modal notifikasi kustom.
     */
    function hideModal() {
        customModal.classList.remove('modal-active');
        customModal.classList.add('modal-inactive');
    }
    
    closeModalButton.addEventListener('click', hideModal);
    customModal.addEventListener('click', (e) => {
        if (e.target.classList.contains('bg-opacity-50')) {
            hideModal();
        }
    });

    /**
     * Memperbarui status tombol dan spinner.
     */
    function updateButtonState(button, textElement, spinner, isLoading, defaultText) {
        button.disabled = isLoading;
        if (isLoading) {
            textElement.textContent = 'Memuat...';
            spinner.classList.remove('hidden');
        } else {
            textElement.textContent = defaultText;
            spinner.classList.add('hidden');
        }
    }

    /**
     * Menampilkan pesan error di form autentikasi.
     */
    function setAuthError(message) {
        authError.textContent = message;
        authError.classList.remove('hidden');
    }

    // --- FIREBASE SETUP & AUTHENTICATION ---

    // 1. Inisialisasi Firebase & Otentikasi
    try {
        app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);

        if (initialAuthToken) {
            signInWithCustomToken(auth, initialAuthToken).catch(error => {
                console.error("Custom token sign-in failed:", error);
                signInAnonymously(auth); // Fallback to anonymous
            });
        } else {
            // Jika token tidak ada, masuk secara anonim
            signInAnonymously(auth);
        }
    } catch (e) {
        console.error("Firebase initialization failed:", e);
        setAuthError("Kesalahan inisialisasi Firebase. Cek konfigurasi.");
    }

    // 2. Listener Perubahan Status Otentikasi
    onAuthStateChanged(auth, (user) => {
        isAuthReady = true;
        if (user) {
            currentUserId = user.uid;
            displayUserId.textContent = currentUserId;
            // Tampilkan Dashboard
            authView.classList.add('hidden');
            dashboardView.classList.remove('hidden');
            
            // Mulai memuat data dashboard
            setupDashboardListeners();
        } else {
            currentUserId = null;
            // Tampilkan Login/Register
            dashboardView.classList.add('hidden');
            authView.classList.remove('hidden');
        }
    });

    // 3. Toggle Mode Login/Register
    switchModeButton.addEventListener('click', () => {
        isRegisterMode = !isRegisterMode;
        authTitle.textContent = isRegisterMode ? 'Daftar Akun Baru' : 'Masuk';
        authButtonText.textContent = isRegisterMode ? 'Daftar' : 'Masuk';
        switchModeButton.textContent = isRegisterMode 
            ? 'Sudah punya akun? Masuk' 
            : 'Belum punya akun? Daftar sekarang';
        authError.classList.add('hidden');
        authForm.reset();
    });

    // 4. Submit Form Autentikasi
    authForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = emailInput.value;
        const password = passwordInput.value;
        
        authError.classList.add('hidden');
        updateButtonState(authButton, authButtonText, authSpinner, true, isRegisterMode ? 'Daftar' : 'Masuk');

        try {
            if (isRegisterMode) {
                // Registrasi
                await createUserWithEmailAndPassword(auth, email, password);
                showModal("Sukses", "Akun berhasil didaftarkan. Anda otomatis masuk.", 'success');
            } else {
                // Login
                await signInWithEmailAndPassword(auth, email, password);
                showModal("Sukses", "Berhasil masuk!", 'success');
            }
        } catch (error) {
            console.error("Auth Error:", error);
            let message = "Terjadi kesalahan autentikasi.";
            if (error.code === 'auth/email-already-in-use') {
                message = "Email sudah digunakan.";
            } else if (error.code === 'auth/invalid-email') {
                message = "Format email tidak valid.";
            } else if (error.code === 'auth/weak-password') {
                message = "Kata sandi harus minimal 6 karakter.";
            } else if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                message = "Email atau kata sandi salah.";
            }
            setAuthError(message);
        } finally {
            updateButtonState(authButton, authButtonText, authSpinner, false, isRegisterMode ? 'Daftar' : 'Masuk');
        }
    });

    // 5. Logout
    logoutButton.addEventListener('click', async () => {
        try {
            await signOut(auth);
            showModal("Berhasil", "Anda telah keluar.", 'info');
        } catch (error) {
            console.error("Logout Error:", error);
            showModal("Gagal Keluar", "Terjadi kesalahan saat keluar.", 'error');
        }
    });

    // --- FIREBASE FIRESTORE DATA HANDLING ---

    // Path constants
    const USER_DATA_PATH = (userId) => `artifacts/${appId}/users/${userId}/user_data/profile`;
    const USER_REDEMPTIONS_COLLECTION = (userId) => `artifacts/${appId}/users/${userId}/user_redemptions`;
    const REDEEMABLE_CODES_COLLECTION = `artifacts/${appId}/public/data/redeemable_codes`;

    /**
     * Inisialisasi kode redeemable publik (Hanya untuk demo)
     */
    async function initializeRedeemableCodes() {
        const codeRef = doc(db, REDEEMABLE_CODES_COLLECTION, "GEMINI-2025");
        const codeSnap = await getDoc(codeRef);

        if (!codeSnap.exists()) {
            await setDoc(codeRef, {
                reward: 50, // Jumlah koin yang diberikan
                description: "Hadiah Ulang Tahun Gemini 2025",
                max_redemptions: 1 // Maksimal 1 kali per pengguna
            });

            await setDoc(doc(db, REDEEMABLE_CODES_COLLECTION, "FREE-COINS-10"), {
                reward: 10,
                description: "Kode Koin Gratis",
                max_redemptions: 100 // Bisa ditukarkan berkali-kali (limit global)
            });
            console.log("Kode redeemable demo diinisialisasi di Firestore.");
        }
    }

    /**
     * Memuat data utama (saldo dan riwayat) dashboard.
     */
    function setupDashboardListeners() {
        if (!db || !currentUserId) return;

        // 1. Ambil & Dengar Saldo Koin Pengguna (Data Pribadi)
        const userDocRef = doc(db, USER_DATA_PATH(currentUserId));
        onSnapshot(userDocRef, (docSnap) => {
            if (docSnap.exists()) {
                const userData = docSnap.data();
                coinBalance.textContent = (userData.coins || 0).toLocaleString('id-ID');
            } else {
                // Inisialisasi data pengguna jika belum ada
                setDoc(userDocRef, { coins: 0, created_at: new Date().toISOString() });
                coinBalance.textContent = '0';
            }
        }, (error) => {
            console.error("Error fetching user data:", error);
        });
        
        // 2. Ambil & Dengar Riwayat Penukaran (Data Pribadi)
        const redemptionsQuery = collection(db, USER_REDEMPTIONS_COLLECTION(currentUserId));
        onSnapshot(redemptionsQuery, (snapshot) => {
            redemptionHistory.innerHTML = ''; // Kosongkan
            if (snapshot.empty) {
                redemptionHistory.innerHTML = '<li class="text-gray-500">Anda belum pernah menukarkan kode.</li>';
                return;
            }

            // Urutkan data berdasarkan waktu penukaran (jika ada)
            const history = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                history.push({ 
                    ...data, 
                    id: doc.id,
                    timestamp: data.timestamp ? data.timestamp.toDate() : new Date() 
                });
            });

            // Sorting (di sisi klien karena menghindari orderBy di onSnapshot)
            history.sort((a, b) => b.timestamp - a.timestamp);

            history.forEach(item => {
                const dateStr = item.timestamp.toLocaleDateString('id-ID', {
                    year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });
                const li = document.createElement('li');
                li.className = 'bg-gray-50 p-3 rounded-lg flex justify-between items-center border-l-4 border-green-500';
                li.innerHTML = `
                    <div>
                        <span class="font-bold text-gray-800">${item.code_id}</span>
                        <p class="text-sm text-gray-500">${dateStr}</p>
                    </div>
                    <span class="font-semibold text-green-600">+${item.reward} Koin</span>
                `;
                redemptionHistory.appendChild(li);
            });
        }, (error) => {
            console.error("Error fetching redemptions:", error);
            redemptionHistory.innerHTML = '<li class="text-red-500">Gagal memuat riwayat penukaran.</li>';
        });

        // 3. Ambil Master Codes (Data Publik - Dijalankan sekali)
        fetchRedeemableCodes();
    }

    /**
     * Memuat daftar kode redeemable dari Firestore (Publik).
     */
    async function fetchRedeemableCodes() {
        try {
            // Pastikan kode demo sudah ada
            await initializeRedeemableCodes(); 
            
            const codesSnapshot = await getDocs(collection(db, REDEEMABLE_CODES_COLLECTION));
            redeemableCodes = {};
            codesSnapshot.forEach(doc => {
                redeemableCodes[doc.id] = doc.data();
            });
            console.log("Kode Redeemab
